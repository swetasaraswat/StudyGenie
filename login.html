<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — StudyGenie</title>
<link rel="stylesheet" href="css/base.css">
<style>
body { display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 420px; position: relative; z-index: 2; }
.login-card h2 { font-size: 1.8em; font-weight: 800; margin-bottom: 8px; }
.login-card > p { color: var(--text-muted); margin-bottom: 28px; }
.field { margin-bottom: 20px; }
.hint { font-size: 0.8em; color: var(--text-faint); margin-top: 6px; }
form button { width: 100%; }
.back-link { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 0.9em; }
.back-link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="bg-animation"></div>

<div class="card login-card">
  <h2>Log In</h2>
  <p>Enter your Gmail and password to proceed.</p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Gmail</label>
      <input id="email" name="email" type="email" required placeholder="you@gmail.com">
      <p class="hint">Only addresses ending with <code>@gmail.com</code>.</p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="6" placeholder="At least 6 characters">
      <p class="hint">Minimum 6 characters.</p>
    </div>
    <button type="submit" class="btn-primary">Log In</button>
  </form>

  <a class="back-link" href="index.html">← Back to home</a>
</div>

<script src="js/pages/login.js"></script>
</body>
</html>
